<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NLPHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="auth-split">
    <!-- BRAND SIDE -->
    <div class="auth-brand" style="background: linear-gradient(135deg, #334155, #0f172a);">
        <a class="navbar-brand text-white fw-bold mb-auto text-decoration-none" href="/">
            <i class="bi bi-robot me-2 fs-4"></i>
            <span class="fs-4">NLPHire</span>
        </a>
        
        <div>
            <h1 class="display-5 fw-bolder text-white mb-4">Reset your<br>access.</h1>
            <p class="lead text-white-50 mb-0" style="max-width: 400px;">
                Don't worry, it happens to the best of us. Set a new password and get back on track.
            </p>
        </div>
        
        <div class="mt-auto pt-5">
            <!-- Empty space filler for layout consistency -->
        </div>
    </div>

    <!-- FORM SIDE -->
    <div class="auth-form-container">
        <div class="auth-form-box animate-fade-in">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-key fs-2"></i>
                </div>
                <h2 class="fw-bolder mb-2 text-secondary">Reset Password</h2>
                <p class="text-muted">Enter your email and a new password</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 border-0 rounded-3 mb-4 py-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <div class="small fw-medium">{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="/forgot-password">
                
                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                    <label for="floatingEmail" class="text-muted">Registered Email</label>
                </div>
                
                <div class="form-floating mb-3 position-relative">
                    <input type="password" id="newPassword" name="new_password" class="form-control pe-5" placeholder="New Password" minlength="8" required>
                    <label for="newPassword" class="text-muted">New Password</label>
                    <i class="bi bi-eye-fill position-absolute" id="toggleNewPassword" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-muted); font-size: 1.25rem; z-index: 10;"></i>
                </div>

                <div class="form-floating mb-4 position-relative">
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-control pe-5" placeholder="Confirm Password" minlength="8" required>
                    <label for="confirmPassword" class="text-muted">Confirm Password</label>
                    <i class="bi bi-eye-fill position-absolute" id="toggleConfirmPassword" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-muted); font-size: 1.25rem; z-index: 10;"></i>
                </div>

                <button class="btn btn-primary w-100 py-3 mb-4 fw-bold shadow-sm">
                    Reset Password
                </button>

                <div class="text-center">
                    <a href="/login" class="text-secondary text-decoration-none small fw-medium">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const toggleNewPassword = document.getElementById("toggleNewPassword");
const newPassword = document.getElementById("newPassword");
toggleNewPassword.addEventListener("click", function () {
    if (newPassword.type === "password") {
        newPassword.type = "text";
        this.classList.remove("bi-eye-fill");
        this.classList.add("bi-eye-slash-fill");
    } else {
        newPassword.type = "password";
        this.classList.remove("bi-eye-slash-fill");
        this.classList.add("bi-eye-fill");
    }
});

const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
const confirmPassword = document.getElementById("confirmPassword");
toggleConfirmPassword.addEventListener("click", function () {
    if (confirmPassword.type === "password") {
        confirmPassword.type = "text";
        this.classList.remove("bi-eye-fill");
        this.classList.add("bi-eye-slash-fill");
    } else {
        confirmPassword.type = "password";
        this.classList.remove("bi-eye-slash-fill");
        this.classList.add("bi-eye-fill");
    }
});
</script>

</body>
</html>
