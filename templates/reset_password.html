<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NLPHire</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="text-center mb-4 animate-fade-in">
                <a href="/" class="text-decoration-none">
                    <i class="bi bi-robot display-4 text-primary"></i>
                    <h2 class="fw-bolder text-dark mt-2">NLPHire</h2>
                </a>
            </div>

            <div class="card-custom border-0 animate-fade-in delay-1">
                <h4 class="fw-bold mb-3 text-center">Set New Password</h4>
                <p class="text-muted text-center mb-4">Enter your new password below.</p>

                {% if error %}
                <div class="alert alert-danger bg-danger bg-opacity-10 text-danger border-danger-subtle d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/reset-password/{{ token }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary small">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="new_password" class="form-control bg-light border-start-0" placeholder="Min. 8 chars, 1 uppercase, 1 number" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-shield-lock text-muted"></i>
                            </span>
                            <input type="password" name="confirm_password" class="form-control bg-light border-start-0" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        Update Password
                    </button>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted small">Remember your password?</span>
                        <a href="/login" class="text-decoration-none fw-semibold small ms-1">Login here</a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
