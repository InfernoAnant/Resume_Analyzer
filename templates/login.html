<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NLPHire</title>
    <!-- Bootstrap FIRST -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS LAST -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="auth-split">
    <!-- BRAND SIDE -->
    <div class="auth-brand">
        <a class="navbar-brand text-white fw-bold mb-auto text-decoration-none" href="/">
            <i class="bi bi-robot me-2 fs-4"></i>
            <span class="fs-4">NLPHire</span>
        </a>
        
        <div>
            <h1 class="display-5 fw-bolder text-white mb-4">Analyze.<br>Match.<br>Get Hired.</h1>
            <p class="lead text-white-50 mb-0" style="max-width: 400px;">
                Welcome to NLPHire. Start optimizing your career with AI.
            </p>
        </div>
        
        <div class="mt-auto pt-5">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-white bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="bi bi-shield-check text-white fs-4"></i>
                </div>
                <div>
                    <h6 class="text-white mb-1 fw-bold">Secure Access</h6>
                    <p class="text-white-50 small mb-0">Your data is encrypted and private.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM SIDE -->
    <div class="auth-form-container">
        <div class="auth-form-box animate-fade-in">
            <div class="text-center mb-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-person fs-2"></i>
                </div>
                <h2 class="fw-bolder mb-2 text-secondary">Welcome to NLPHire</h2>
                <p class="text-muted">Sign in to continue.</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 border-0 rounded-3 mb-4 py-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <div class="small fw-medium">{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" autocomplete="email" required>
                    <label for="floatingEmail" class="text-muted">Email address</label>
                </div>
                
                <div class="form-floating mb-3 position-relative">
                    <input type="password" id="loginPassword" name="password" class="form-control pe-5" placeholder="Password" minlength="8" autocomplete="current-password" required>
                    <label for="loginPassword" class="text-muted">Password</label>
                    <i class="bi bi-eye-fill position-absolute" id="toggleLoginPassword" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-muted); font-size: 1.25rem; z-index: 10;"></i>
                </div>

                <div class="d-flex justify-content-end mb-4">
                    <a href="/forgot-password" class="text-primary text-decoration-none fw-medium small">Forgot password?</a>
                </div>

                <button class="btn btn-primary w-100 py-3 mb-4 fw-bold shadow-sm">
                    Sign In
                </button>

                <p class="text-center text-muted small mb-0">
                    Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold ms-1">Create one</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script>
const toggleLoginPassword = document.getElementById("toggleLoginPassword");
const loginPassword = document.getElementById("loginPassword");
toggleLoginPassword.addEventListener("click", function () {
    if (loginPassword.type === "password") {
        loginPassword.type = "text";
        this.classList.remove("bi-eye-fill");
        this.classList.add("bi-eye-slash-fill");
    } else {
        loginPassword.type = "password";
        this.classList.remove("bi-eye-slash-fill");
        this.classList.add("bi-eye-fill");
    }
});
</script>

</body>
</html>
